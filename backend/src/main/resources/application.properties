quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/drinking;AUTO_SERVER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=

# keep existing data, only create/adjust tables as needed
quarkus.hibernate-orm.database.generation=update

quarkus.http.cors.enabled=true

#dev only changeme!
quarkus.http.cors.origins=/.*/

quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type
# dev only: the Android emulator reaches the host as 10.0.2.2, which the default localhost host validation rejects
%dev.quarkus.http.host-validation.allowed-hosts=localhost,127.0.0.1,[::1],10.0.2.2
