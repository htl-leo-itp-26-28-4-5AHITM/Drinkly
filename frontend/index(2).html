<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drinking tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2150e8;--tint:#e8eefe;--ink:#172033;--muted:#6a7488;--line:#e3e7ee;--bg:#f5f7fa;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:340px 1fr;min-height:100vh}

aside{background:var(--blue);color:#fff;padding:2.5rem 2rem;position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:1.1rem}
aside h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
aside p{margin:0 0 .6rem;opacity:.8}
label{display:grid;gap:.35rem;font-size:.8rem;font-weight:700}
input{width:100%;font:inherit;font-weight:500;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:.7rem .8rem;color-scheme:dark}
input::placeholder{color:rgba(255,255,255,.65)}
input:focus-visible,button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.quick{display:flex;flex-wrap:wrap;gap:.4rem}
.quick button{font:inherit;font-weight:700;font-size:.85rem;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:.25rem .8rem;cursor:pointer}
.quick button:hover{background:rgba(255,255,255,.16)}
#add{margin-top:.4rem;font:inherit;font-weight:800;color:var(--blue);background:#fff;border:0;border-radius:10px;padding:.85rem;cursor:pointer}
#add:hover{background:var(--tint)}

main{width:100%;max-width:780px;padding:2.5rem clamp(1rem,4vw,3rem)}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.tabs{display:flex;gap:1.2rem;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:.3rem 0;cursor:pointer}
.tabs button small{font-weight:500;margin-left:.3rem}
.tabs button.on{color:var(--ink);border-bottom-color:var(--blue)}
.tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
#sync{font-size:.85rem;color:var(--muted)}
#summary{margin:1rem 0 0;color:var(--muted);min-height:1.5em}

.day{margin-top:1.4rem;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 1.1rem}
.day header{display:flex;justify-content:space-between;padding:.9rem 0 .6rem;font-weight:800;border-bottom:1px solid var(--line)}
.day header span{color:var(--muted);font-weight:700}
.day ul{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:36px 1fr auto 30px;align-items:center;gap:.9rem;padding:.75rem 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.flash{animation:flash 1.8s ease-out}
@keyframes flash{from{background:var(--tint);box-shadow:-1.1rem 0 0 var(--tint),1.1rem 0 0 var(--tint)}to{background:transparent;box-shadow:none}}
.av{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-size:.75rem;font-weight:800}
.who strong{display:block;line-height:1.25}
.who small{color:var(--muted)}
.amt{font-weight:800}
.del{width:30px;height:30px;display:grid;place-items:center;color:var(--muted);background:none;border:0;border-radius:50%;cursor:pointer}
.del:hover{background:var(--tint);color:var(--blue)}
.del:focus-visible{outline:2px solid var(--blue)}
.empty{margin-top:1.4rem;padding:2.5rem 1rem;text-align:center;color:var(--muted);border:1px dashed #c9cfdb;border-radius:14px}

#toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,200%);display:flex;align-items:center;gap:1rem;background:var(--ink);color:#fff;font-weight:500;border-radius:10px;padding:.7rem 1rem;max-width:92vw;transition:transform .25s}
#toast.show{transform:translate(-50%,0)}
#toast button{font:inherit;font-weight:800;color:#9db6ff;background:none;border:0;cursor:pointer;padding:0}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:1.5rem 1.25rem;border-radius:0 0 20px 20px}
}
@media (prefers-reduced-motion:reduce){.item.flash{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div>
      <h1>Drinking tracker</h1>
      <p>The list refreshes automatically.</p>
    </div>
    <label>Name
      <input id="user" list="users" placeholder="e.g. alice" autocomplete="off" maxlength="40">
      <datalist id="users"></datalist>
    </label>
    <label>Amount in litres
      <input id="amount" type="number" min="0" step="0.05" placeholder="0.5">
    </label>
    <div class="quick" id="quick" aria-label="Quick amounts">
      <button type="button" data-v="0.25">0.25</button>
      <button type="button" data-v="0.33">0.33</button>
      <button type="button" data-v="0.5">0.5</button>
      <button type="button" data-v="1">1</button>
    </div>
    <label>When (optional)
      <input id="when" type="datetime-local">
    </label>
    <button id="add" type="button">Add entry</button>
  </aside>

  <main>
    <div class="top">
      <nav class="tabs" id="filters" aria-label="Filter by user"></nav>
      <div id="sync" role="status"></div>
    </div>
    <p id="summary"></p>
    <div id="list"></div>
  </main>
</div>
<div id="toast" role="status"></div>

<script>
// Address of the Quarkus backend, without a trailing slash.
// Use '' only if this page is served by the backend itself.
// Can be overridden per visit, e.g. https://my-site.example/?api=https://api.example.com
const BACKEND_URL = 'http://localhost:8080';
const BACKEND = (new URLSearchParams(location.search).get('api') || BACKEND_URL).replace(/\/+$/, '');
const API = BACKEND + '/entries';
const EVENTS_URL = BACKEND + '/events';
const $ = s => document.querySelector(s);
const L = n => String(Math.round(n * 100) / 100);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let filter = '', totals = {}, byId = new Map(), seen = new Set(), loaded = false, lastSig = '', live = false;

function toast(msg, action) {
  const t = $('#toast');
  t.textContent = msg;
  if (action) {
    const b = document.createElement('button');
    b.textContent = action.label;
    b.onclick = () => { t.classList.remove('show'); action.run(); };
    t.append(b);
  }
  t.classList.add('show');
  clearTimeout(toast.id);
  toast.id = setTimeout(() => t.classList.remove('show'), action ? 6000 : 3000);
}

async function api(url, opts) {
  let r;
  try { r = await fetch(url, {cache: 'no-store', ...opts}); }
  catch { throw new Error("Can't reach the backend at " + (BACKEND || location.origin) + ". Is it running, and is CORS allowed?"); }
  if (!r.ok) throw new Error((await r.text()) || 'Server answered ' + r.status);
  return r.status === 204 ? null : r.json();
}

function dayLabel(d) {
  const today = new Date(), yest = new Date(Date.now() - 864e5);
  if (d.toDateString() === today.toDateString()) return 'Today';
  if (d.toDateString() === yest.toDateString()) return 'Yesterday';
  return d.toLocaleDateString([], {weekday: 'short', day: 'numeric', month: 'short'});
}

const icon = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';

function row(e, fresh) {
  const n = e.user?.username ?? '?';
  const time = new Date(e.timestamp).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  return `<li class="item${fresh.has(e.id) ? ' flash' : ''}">
    <span class="av">${esc(n.slice(0, 2).toUpperCase())}</span>
    <div class="who"><strong>${esc(n)}</strong><small>${esc(time)}</small></div>
    <span class="amt">${L(e.drinkingAmount)} L</span>
    <button class="del" data-id="${e.id}" aria-label="Remove entry of ${esc(n)}">${icon}</button>
  </li>`;
}

function render(shown, fresh) {
  const names = Object.keys(totals).sort();
  $('#users').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');
  $('#filters').innerHTML =
    `<button class="${filter === '' ? 'on' : ''}" data-u="">Everyone</button>` +
    names.map(n => `<button class="${filter === n ? 'on' : ''}" data-u="${esc(n)}">${esc(n)}<small>${L(totals[n])} L</small></button>`).join('');

  const sorted = [...shown].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp) || b.id - a.id);
  const total = sorted.reduce((s, e) => s + e.drinkingAmount, 0);
  $('#summary').textContent = sorted.length
    ? `${sorted.length} ${sorted.length === 1 ? 'entry' : 'entries'}, ${L(total)} L in total`
    : '';

  if (!sorted.length) {
    $('#list').innerHTML = '<div class="empty">No entries yet. Add the first one on the left.</div>';
    return;
  }
  const groups = new Map();
  for (const e of sorted) {
    const key = new Date(e.timestamp).toDateString();
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  }
  $('#list').innerHTML = [...groups.values()].map(items => {
    const sum = items.reduce((s, e) => s + e.drinkingAmount, 0);
    return `<section class="day"><header>${esc(dayLabel(new Date(items[0].timestamp)))}<span>${L(sum)} L</span></header>
      <ul>${items.map(e => row(e, fresh)).join('')}</ul></section>`;
  }).join('');
}

async function load(silent) {
  try {
    const all = await api(API);
    totals = {};
    byId = new Map(all.map(e => [e.id, e]));
    all.forEach(e => { const u = e.user?.username ?? '?'; totals[u] = (totals[u] || 0) + e.drinkingAmount; });
    if (filter && !totals[filter]) filter = '';
    const shown = filter ? await api(`${API}/${encodeURIComponent(filter)}`) : all;
    const fresh = new Set(loaded ? all.filter(e => !seen.has(e.id)).map(e => e.id) : []);
    seen = new Set(all.map(e => e.id));
    loaded = true;
    const sig = JSON.stringify([filter, shown, totals]);
    const changed = sig !== lastSig;
    lastSig = sig;
    if (changed) render(shown, fresh);
    $('#sync').textContent = live ? 'Live' : 'Updated ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});
  } catch (e) {
    $('#sync').textContent = 'Backend unreachable, retrying';
    if (!silent) toast(e.message);
  }
}

async function create(body) {
  await api(API, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  await load();
}

async function add() {
  const username = $('#user').value.trim();
  const amount = parseFloat($('#amount').value);
  if (!username) return toast('Enter a name.');
  if (!(amount > 0)) return toast('Enter an amount greater than 0.');
  const body = {user: {username}, drinkingAmount: amount};
  if ($('#when').value) body.timestamp = new Date($('#when').value).toISOString();
  try {
    await create(body);
    $('#amount').value = '';
    $('#when').value = '';
    toast('Entry added.');
  } catch (e) { toast(e.message); }
}

async function remove(id) {
  const e = byId.get(id);
  if (!e) return;
  try {
    await api(`${API}/${id}`, {method: 'DELETE'});
    await load();
    toast('Entry removed.', {label: 'Undo', run: () =>
      create({user: e.user, drinkingAmount: e.drinkingAmount, timestamp: e.timestamp}).catch(err => toast(err.message))});
  } catch (err) { toast(err.message); }
}

$('#add').onclick = add;
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('#user, #amount')) add(); });
$('#quick').onclick = e => { const b = e.target.closest('button'); if (b) $('#amount').value = b.dataset.v; };
$('#filters').onclick = e => { const b = e.target.closest('button'); if (b) { filter = b.dataset.u; load(); } };
$('#list').onclick = e => { const b = e.target.closest('.del'); if (b) remove(Number(b.dataset.id)); };

// Instant updates: the backend pushes a message whenever an entry is added or removed
function connect() {
  const es = new EventSource(EVENTS_URL);
  es.onopen = () => { live = true; load(true); };
  es.onmessage = () => load(true);
  es.onerror = () => {
    live = false;
    $('#sync').textContent = 'Reconnecting';
    if (es.readyState === EventSource.CLOSED) { es.close(); setTimeout(connect, 2000); }
  };
}

load();
connect();
// Safety net for changes the backend can't announce (e.g. edits made directly in the database)
setInterval(() => { if (!document.hidden) load(true); }, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
</script>
</body>
</html>
